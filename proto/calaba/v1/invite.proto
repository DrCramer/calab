syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";
import "calaba/v1/auth.proto";
import "calaba/v1/room.proto";
import "calaba/v1/user.proto";

// Room link (ADR-0016): https://<domain>/r/<code>, calaba://r/<code>. A capability for one
// room: registered users join the workspace as `guest` (if not members) with access to this
// room; without an account (allow_guests) a guest account is created from a nickname.
message RoomInvite {
  string id = 1;
  string room_id = 2;
  string workspace_id = 3;
  string code = 4;
  string created_by = 5;
  google.protobuf.Timestamp expires_at = 6; // unset = never
  uint32 max_uses = 7;                      // 0 = unlimited
  uint32 uses = 8;
  bool allow_guests = 9;                    // people without an account may join by nickname
  // What joiners may do in the room (VIEW_ROOM and CONNECT are always granted).
  bool allow_speak = 10;
  bool allow_messages = 11;
  bool allow_files = 12;
  bool allow_stream = 13;
  google.protobuf.Timestamp created_at = 14;
  // Meeting guest links (ADR-0038 «Дополнение»): made by the server for one external attendee
  // of event_id, single-use, valid from not_before (15 minutes before the meeting) until 1 h
  // after it ends.
  google.protobuf.Timestamp not_before = 15;
  string event_id = 16;
  // Guest admission (ADR-0040): unset = as the room (Room.guest_approval); true = guests
  // arriving by this link wait for a decision; false = they come in at once. Meeting guest
  // links are made unset.
  optional bool require_approval = 17;
  // Members-only link (ADR-0043): gives members of the workspace (not guests) access to the
  // room; anyone else is refused (403 INVITE_MEMBERS_ONLY). allow_guests is false then.
  bool members_only = 18;
}

// POST /api/rooms/{id}/invites: INVITE_GUESTS in the room; a members_only link also with
// INVITE_MEMBERS there (ADR-0043). Unset fields take the defaults: 7 days, unlimited uses,
// allow_guests true, speak true, messages true, files false, stream false.
message CreateRoomInviteRequest {
  optional uint32 expires_in_seconds = 1; // 0 = never; ≤ 365 days
  uint32 max_uses = 2;
  optional bool allow_guests = 3;
  optional bool allow_speak = 4;
  optional bool allow_messages = 5;
  optional bool allow_files = 6;
  optional bool allow_stream = 7;
  optional bool require_approval = 8; // unset = as the room (ADR-0040)
  bool members_only = 9; // ADR-0043: only for members of the workspace; forces allow_guests false
}

message CreateRoomInviteResponse {
  RoomInvite invite = 1;
}

// PATCH /api/rooms/{id}/invites/{invite_id}: changes an active link; only the fields that are
// set change, at least one. Approval (ADR-0040): inherit_approval true resets it to the room's
// (require_approval must then be unset); otherwise require_approval, when set, overrides the
// room for this link; INVITE_GUESTS, guest links only. The rest (ADR-0107) with the right to
// manage this kind of link, as when creating it (INVITE_GUESTS; a members_only link also with
// INVITE_MEMBERS or as the creator of the temporary room); never on a meeting guest link
// (event_id). expires_in_seconds counts from now, 0 = never, ≤ 365 days; max_uses 0 = unlimited,
// ≤ 10000 and above the uses so far; allow_* within the caller's own rights. members_only and
// allow_guests never change (a new link instead).
message UpdateRoomInviteRequest {
  optional bool require_approval = 1;
  bool inherit_approval = 2;
  optional uint32 expires_in_seconds = 3;
  optional uint32 max_uses = 4;
  optional bool allow_speak = 5;
  optional bool allow_messages = 6;
  optional bool allow_files = 7;
  optional bool allow_stream = 8;
}

message UpdateRoomInviteResponse {
  RoomInvite invite = 1;
}

// GET /api/rooms/{id}/invites: active links — all with INVITE_GUESTS in the room, only the
// members_only ones with INVITE_MEMBERS alone (ADR-0043).
message ListRoomInvitesResponse {
  repeated RoomInvite invites = 1;
}

// GET /api/room-invites/{code} — public preview for the /r/<code> page (no auth).
message GetRoomInviteResponse {
  string room_name = 1;
  RoomType room_type = 2;
  string workspace_name = 3;
  string workspace_icon_file_id = 4;
  bool allow_guests = 5;
  google.protobuf.Timestamp expires_at = 6;
  // Set = the link works only from then (a meeting's guest link): join → 409
  // INVITE_NOT_YET_VALID before it.
  google.protobuf.Timestamp not_before = 7;
  // Guests arriving by this link wait for the organizer's approval (ADR-0040): the link's
  // require_approval, else the room's guest_approval. Members of the workspace never wait.
  bool requires_approval = 8;
  // Only members of the workspace may use the link (ADR-0043).
  bool members_only = 9;
}

// POST /api/room-invites/{code}/join. With an access token: joins as the current user.
// Without one (allow_guests): creates a guest account named `nickname` and signs it in
// (web clients with X-Client: web get the refresh token as a cookie, as on login).
message JoinRoomInviteRequest {
  string nickname = 1;
  string device_name = 2;
}

message JoinRoomInviteResponse {
  string room_id = 1;
  string workspace_id = 2;
  AuthTokens tokens = 3; // only when a guest account was created
  Me me = 4;             // only when a guest account was created
  // Set = the caller waits for approval (ADR-0040, status PENDING): the room is not theirs
  // until ROOM_ADMISSION_DECIDED (ADMITTED) arrives on their user channel.
  RoomAdmission admission = 5;
}

// Guest admission, the «waiting room» of room links (ADR-0040).
enum RoomAdmissionStatus {
  ROOM_ADMISSION_STATUS_UNSPECIFIED = 0;
  ROOM_ADMISSION_STATUS_PENDING = 1;
  ROOM_ADMISSION_STATUS_ADMITTED = 2;
  ROOM_ADMISSION_STATUS_DECLINED = 3;
  // Events only: the guest withdrew the knock (DELETE /api/rooms/{id}/admissions/me).
  ROOM_ADMISSION_STATUS_CANCELLED = 4;
}

// A guest's knock on a room. Deciders (MANAGE_ROOM in the room, or the author of the link
// the guest came by) see pending ones in GET /api/rooms/{id}/admissions, in
// WorkspaceSnapshot.admissions and in ROOM_ADMISSION_REQUEST; the guest sees their own in
// Ready.pending_admissions, JoinRoomInviteResponse.admission and ROOM_ADMISSION_DECIDED.
message RoomAdmission {
  string room_id = 1;
  string workspace_id = 2;
  // The knocking user (to deciders; to the guest themselves only user.id is set).
  User user = 3;
  string invite_id = 4;         // the link used; empty if it is gone
  string invite_created_by = 5; // its author, who may decide too; empty for the guest
  RoomAdmissionStatus status = 6;
  google.protobuf.Timestamp requested_at = 7;
  string decided_by = 8;        // empty = nobody (no answer, cancelled) or not decided
  google.protobuf.Timestamp decided_at = 9;
  // DECLINED because nobody answered within 30 minutes: the guest may knock again at once.
  // After a decline by a person a new knock is refused for 10 minutes (429, reason
  // ADMISSION_DECLINED).
  bool no_answer = 10;
  // Filled for the guest (the waiting screen): the room and workspace names.
  string room_name = 11;
  string workspace_name = 12;
}

// GET /api/rooms/{id}/admissions: pending knocks, oldest first. MANAGE_ROOM sees all of the
// room; the author of a link without MANAGE_ROOM sees those who came by their links.
message ListRoomAdmissionsResponse {
  repeated RoomAdmission admissions = 1;
}

// POST /api/rooms/{id}/admissions/{user_id} (a decider; not bots). status ADMITTED or
// DECLINED. On admission display_name (1..40, guest accounts only) renames the guest and
// badge_id ("" = none; from the workspace library) sets their badge. 409 CONFLICT when the
// knock is no longer pending.
message DecideRoomAdmissionRequest {
  RoomAdmissionStatus status = 1;
  optional string display_name = 2;
  optional string badge_id = 3;
}

message DecideRoomAdmissionResponse {
  RoomAdmission admission = 1;
}
