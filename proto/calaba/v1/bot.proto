syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";
import "calaba/v1/user.proto";

// Bots and the Bot API (ADR-0031, docs/05 «Боты»). A bot is a user (User.is_bot) that
// authenticates with a token "calab_bot_<user_id>_<secret>" in `Authorization: Bearer …` and
// uses the same REST API and gateway as the clients, within the rights its roles give it.
// Endpoints for people only (password, email, sessions, creating workspaces, invitations,
// billing, superadmin, …) answer a bot 403 FORBIDDEN with reason "BOT_NOT_ALLOWED".

// A command a bot understands, shown by the composer when "/" is typed.
message BotCommand {
  string name = 1;        // 1..32 characters of [a-z0-9_], without the slash
  string description = 2; // ≤ 256 characters
}

// Webhook of a bot (PUT /api/bots/me/webhook). Deliveries are retried with backoff 1 min → 1 h;
// after a day of failures the webhook is disabled (disabled_at) until it is set again.
message BotWebhook {
  string url = 1;   // https URL; empty = no webhook
  bool enabled = 2; // url set and not disabled
  google.protobuf.Timestamp disabled_at = 3;
  google.protobuf.Timestamp failing_since = 4; // unset = the last delivery succeeded
  google.protobuf.Timestamp last_ok_at = 5;
  string last_error = 6;
  uint32 pending = 7; // deliveries waiting; filled by GET /api/bots/me/webhook only
}

message Bot {
  User user = 1;          // the bot's account (is_bot = true)
  string username = 2;    // unique [a-z0-9_]{3,32}: "/cmd@username", link /bots/<username>
  string owner_user_id = 3;
  string workspace_id = 4; // home workspace (where it was created and is managed)
  string description = 5;  // ≤ 512 characters
  repeated BotCommand commands = 6;
  // The first characters of the current token's secret, to tell tokens apart; empty = the
  // token was revoked (the bot cannot sign in until a new one is issued). Like webhook: for
  // the bot, its owner and MANAGE_BOTS members of its home workspace only.
  string token_prefix = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp revoked_at = 9;
  // Set for the bot itself, its owner and MANAGE_BOTS members of its home workspace.
  BotWebhook webhook = 10;
  // ADR-0106: the bot may act on behalf of its owner (REST requests with the header
  // "Calab-On-Behalf: owner"); since = when the owner turned it on. Seen like webhook (the bot,
  // its owner, MANAGE_BOTS of the home workspace); the public card shows it to the owner only.
  bool acts_as_owner = 11;
  google.protobuf.Timestamp acts_as_owner_since = 12;
}

// POST /api/workspaces/{id}/bots (MANAGE_BOTS, ADR-0048; plan limit `bots`, 409
// CONFLICT reason PLAN_LIMIT) → 201. The bot joins the workspace with the member role. The
// token is returned only here and by POST …/bots/{botId}/token.
message CreateBotRequest {
  string display_name = 1; // 1..64
  string username = 2;     // [a-z0-9_]{3,32}, unique (409 CONFLICT)
  string description = 3;  // ≤ 512
}

message CreateBotResponse {
  Bot bot = 1;
  string token = 2;
}

// GET /api/workspaces/{id}/bots (MANAGE_BOTS): bots that are members of the workspace.
message ListBotsResponse {
  repeated Bot bots = 1;
}

// POST /api/workspaces/{id}/bots/{botId}/token — a new token (home workspace: the bot's
// owner or MANAGE_BOTS); the previous one stops working at once. DELETE of the same
// path revokes the token without a new one (204).
message ReissueBotTokenResponse {
  Bot bot = 1;
  string token = 2;
}

// POST /api/workspaces/{id}/bots/{botId}/avatar — sets the bot's avatar from the multipart
// field "file" (an image ≤ 5 MB, like POST /api/me/avatar: 422 VALIDATION otherwise); DELETE
// of the same path removes it. Home workspace only: the bot's owner or MANAGE_BOTS
// (403 elsewhere, 404 when the bot is not a member of {id}). Members see USER_UPDATE, the
// managers BOT_UPDATE (docs/09 #87).
message SetBotAvatarResponse {
  Bot bot = 1;
}

// PATCH /api/workspaces/{id}/bots/{botId} (ADR-0106), the bot's home workspace: unset fields
// stay. acts_as_owner is changed by the bot's owner only: anyone else (MANAGE_BOTS included)
// gets 403 FORBIDDEN reason ON_BEHALF_OWNER_ONLY. Bots (on behalf or not) get 403.
message UpdateBotRequest {
  optional bool acts_as_owner = 1;
}

message UpdateBotResponse {
  Bot bot = 1;
}

// ADR-0111: a member's own consent for the bot to act on their behalf in a workspace (REST
// requests of the bot with the header "Calab-On-Behalf: <user id>"); since = when it was given.
message BotDelegation {
  string user_id = 1;
  google.protobuf.Timestamp since = 2;
}

// ADR-0111: a pending suggestion of invited_by to user_id; the bot's DM to user_id carries the
// buttons «Принять» / «Отказаться» (only the invitee's own click accepts).
message BotDelegationInvite {
  string user_id = 1;
  string invited_by = 2;
  google.protobuf.Timestamp created_at = 3;
}

// GET /api/workspaces/{id}/bots/{botId}: a bot that is a member of the workspace, for its
// members (not guests) and for the bot itself. bot is its card (with the managed fields for
// the bot, its owner and MANAGE_BOTS of its home workspace); on_behalf_user_ids = the members
// it may act for in this workspace now (ADR-0111), with their consents and the pending
// invitations. Also the answer of the delegation routes below.
//
// PUT /api/workspaces/{id}/bots/{botId}/delegations/{userId}: the caller's own consent;
// DELETE: its revocation, effective at once. userId must be the caller (403 FORBIDDEN reason
// ON_BEHALF_SELF_ONLY: nobody, admins and the bot's owner included, gives or takes it for
// another member). People with a non-guest role only; bots and requests on behalf get 403.
// POST /api/workspaces/{id}/bots/{botId}/delegation-invites (InviteBotDelegationRequest): the
// bot DMs each listed member a suggestion naming the caller. The bot itself may call it for
// its own {botId} (ADR-0119): the suggestion then names the bot; another bot, or the bot on
// behalf of someone, gets 403. DELETE …/delegation-invites/{userId}: cancels a pending
// invitation, by its inviter or the invitee (people only).
message GetBotResponse {
  Bot bot = 1;
  repeated string on_behalf_user_ids = 2;
  repeated BotDelegation delegations = 3;
  repeated BotDelegationInvite invites = 4;
  // Only in the answer of POST …/delegation-invites: the DM messages of the invitations this
  // request sent, and (when the caller is the bot) of the requested members' invitations that
  // were already pending.
  repeated BotDelegationInviteMessage sent = 5;
}

// The bot's DM that carries an invitation (ADR-0119). url opens that message in Calab (the
// app when it is installed, the web client otherwise): PUBLIC_APP_URL/m/<room_id>/<message_id>,
// empty when the server has no PUBLIC_APP_URL. It holds no token: only the invitee, who is a
// member of the DM, can open the message and press «Принять».
message BotDelegationInviteMessage {
  string user_id = 1;
  string message_id = 2;
  string room_id = 3;
  string url = 4;
  bool created = 5; // false: an invitation already pending, sent earlier
}

// At most 20 members of the workspace with a non-guest role, people, not the caller. Members
// who already consented or are invited are skipped, and so are members who declined an
// invitation to this bot here within the last 7 days; when every listed member declined so,
// 409 CONFLICT reason DELEGATION_INVITE_DECLINED with Retry-After (seconds), used = seconds
// left, limit = the cooldown in seconds. reason (optional, at most 200 characters, plain text:
// one line, no mentions, links or markup) is shown in the DM as the inviter's words.
message InviteBotDelegationRequest {
  repeated string user_ids = 1;
  string reason = 2;
}

// ADR-0119: a member's consent for the bot changed (BOT_DELEGATION). To that bot only, over
// gateway (its user channel) and its webhook. state: "granted" (the member allowed it: PUT
// …/delegations/{userId} or «Принять» in the bot's DM), "revoked" (the member took it back:
// DELETE …/delegations/{userId}), "declined" (the member pressed «Отказаться» or declined the
// invitation in the dialog). A consent that stops counting for another reason (the member
// left, became a guest) sends nothing: the bot reads GET …/bots/{botId}.
message BotDelegationChange {
  string id = 1; // stable across transports and webhook retries; dedupe by it
  string bot_user_id = 2;
  string workspace_id = 3;
  string user_id = 4; // the member, from the authentication of their own request
  string state = 5;
  google.protobuf.Timestamp at = 6;
}

// POST /api/workspaces/{id}/bots/add (MANAGE_BOTS of that workspace): adds an existing
// bot by id or username (member role). 409 CONFLICT: already a member or plan limit.
message AddBotRequest {
  string bot_user_id = 1;
  string username = 2; // used when bot_user_id is empty
}

message AddBotResponse {
  Bot bot = 1;
}

// GET /api/bots/me and PATCH /api/bots/me (bots only); also GET /api/bots/{id|username}, the
// public card (no owner, home workspace, token prefix or webhook; the bot's owner gets
// owner_user_id, workspace_id and acts_as_owner, ADR-0106).
message GetBotMeResponse {
  Bot bot = 1;
}

// PATCH /api/bots/me: unset fields stay. → GetBotMeResponse.
message UpdateBotMeRequest {
  optional string display_name = 1; // 1..64
  optional string description = 2;  // ≤ 512
}

// PUT /api/bots/me/commands: replaces all commands (≤ 100, unique names).
message SetBotCommandsRequest {
  repeated BotCommand commands = 1;
}

message SetBotCommandsResponse {
  repeated BotCommand commands = 1;
}

// PUT /api/bots/me/webhook: https only, public addresses only; secret 16..256 characters signs
// every delivery (X-Calab-Signature: sha256=hex(HMAC-SHA256(secret, body))). DELETE → 204.
message SetBotWebhookRequest {
  string url = 1;
  string secret = 2;
}

// PUT and GET /api/bots/me/webhook.
message BotWebhookResponse {
  BotWebhook webhook = 1;
}

// Commands of the bots in a room (GET /api/rooms/{id}/bot-commands, VIEW_ROOM): composer hints.
message RoomBotCommands {
  string bot_user_id = 1;
  string username = 2;
  repeated BotCommand commands = 3;
}

message ListRoomBotCommandsResponse {
  repeated RoomBotCommands bots = 1;
}

// GET /api/me/blocked-bots; POST / DELETE /api/me/blocked-bots/{id} → 204 (people only). A
// blocked bot gets 403 BOT_BLOCKED when it writes to the person (new DM or a DM message).
message ListBlockedBotsResponse {
  repeated string bot_user_ids = 1;
}

// BOT_CREATE / BOT_UPDATE: a bot joined the workspace / changed (profile, commands, token,
// webhook state). To MANAGE_BOTS members and the bot's owner.
message BotCreate {
  string workspace_id = 1;
  Bot bot = 2;
}

message BotUpdate {
  string workspace_id = 1;
  Bot bot = 2;
}

// BOT_DELETE: the bot was deleted or removed from the workspace.
message BotDelete {
  string workspace_id = 1;
  string bot_user_id = 2;
}
