syntax = "proto3";
package calaba.v1;

import "google/protobuf/timestamp.proto";
import "calaba/v1/rtc.proto";

// Telephony: outbound calls to phone numbers from a voice room over SIP (ADR-0046). The
// workspace's SIP provider account becomes a LiveKit SIPOutboundTrunk; a call puts the phone
// line into the room's LiveKit room as one more participant (identity "sip:<call id>", name =
// the number), so everyone in the call hears and speaks to the callee like to a person.
//
// Who: PLACE_CALLS (ADR-0046, nobody by default) with VIEW_ROOM and CONNECT in the room, never
// guests, and only while the caller is in that room's call. Workspace.sip_enabled says whether
// telephony is on (the client shows the «call a number» button when it is set and the caller
// has PLACE_CALLS in the room). Settings and the connection test need MANAGE_INTEGRATIONS, the
// journal VIEW_JOURNALS (ADR-0048), bots by the same bits (ADR-0109); bots
// may place and end calls like people.

enum SipTransport {
  SIP_TRANSPORT_UNSPECIFIED = 0; // in PUT: UDP
  SIP_TRANSPORT_UDP = 1;
  SIP_TRANSPORT_TCP = 2;
  SIP_TRANSPORT_TLS = 3;
}

// DIALING → RINGING → ACTIVE → ENDED; DIALING | RINGING → FAILED | ENDED. RINGING may be skipped
// (LiveKit reports the provider's 180 only when the line joins the room). ENDED and FAILED are
// final.
enum SipCallStatus {
  SIP_CALL_STATUS_UNSPECIFIED = 0;
  SIP_CALL_STATUS_DIALING = 1; // the INVITE is on its way to the provider
  SIP_CALL_STATUS_RINGING = 2; // the callee's phone rings
  SIP_CALL_STATUS_ACTIVE = 3;  // answered: the callee is in the room (answered_at set)
  SIP_CALL_STATUS_ENDED = 4;   // hung up after or before the answer (reason says who / why)
  SIP_CALL_STATUS_FAILED = 5;  // never answered (reason says why)
}

enum SipCallDirection {
  SIP_CALL_DIRECTION_UNSPECIFIED = 0;
  SIP_CALL_DIRECTION_OUT = 1;
  SIP_CALL_DIRECTION_IN = 2; // a call to the workspace's number (ADR-0117): room_id empty
}

// The workspace's SIP provider account (one per workspace). GET never returns the password.
message SipSettings {
  // Telephony switched on by an admin. Calls work when this is set and LiveKit accepted the
  // trunk (Workspace.sip_enabled = enabled && trunk saved).
  bool enabled = 1;
  string provider = 2;   // free label, e.g. «Zadarma»; ≤ 64 characters
  string host = 3;       // provider SIP server: host name or IP address, no «sip:» and no port (see port)
  SipTransport transport = 4;
  string username = 5;   // SIP login (may be empty: IP-authenticated trunks)
  bool has_password = 6; // a password is stored (it is never sent back)
  string caller_id = 7;  // the number the calls come from, E.164 (+74951234567)
  // Dial prefix put before the callee's digits: the number is dialed as outbound_prefix +
  // E.164 digits without «+» (e.g. prefix «+» dials +7…, «8» dials 87…, empty dials 7…).
  string outbound_prefix = 8;
  // Numbers that may be called, as E.164 prefixes («+7», «+7495»); empty = any number.
  repeated string allowed_prefixes = 9;
  // The last error of LiveKit (saving) or of the provider (connection test); empty = none.
  string last_error = 10;
  google.protobuf.Timestamp updated_at = 11; // unset = never saved
  string updated_by = 12;                    // user id; empty = unknown / account gone
  bool trunk_saved = 13;                     // LiveKit holds the trunk (calls possible when enabled)
  // SIP authentication user when it differs from username (the From user); empty = username.
  string auth_username = 14;
  uint32 port = 15; // SIP signalling port of host, 1..65535 (5060 when never set)
  // The server can answer inbound calls: LiveKit and the IVR worker token are configured
  // (ADR-0117; no server switch since ADR-0121). The exchange below can be set up either way.
  bool inbound_available = 16;
  // Inbound calls on caller_id (ADR-0117, PUT /api/workspaces/{id}/sip/inbound). Calls are
  // answered when inbound_enabled and inbound_saved are set; a workspace that never switched
  // inbound calls on takes none.
  bool inbound_enabled = 17;
  SipRouteTarget inbound_target = 18;         // the entry point: a menu, a number or a group
  repeated string inbound_allowed_cidrs = 19; // provider addresses beyond the resolved host
  bool inbound_saved = 20;                    // LiveKit holds the inbound trunk and its dispatch rule
  // How inbound calls reach us (ADR-0121): DIRECT (the provider sends INVITE to our address) or
  // REGISTER (the registration agent registers at the provider and hands its calls over).
  SipInboundMode inbound_mode = 21;
  // The registration at the provider (REGISTER mode; unset otherwise).
  SipRegistration registration = 22;
  // The server has the registration agent (SIPREG_AGENT_TOKEN): REGISTER mode can be chosen.
  bool registration_available = 23;
  // Call recording to the workspace Disk (ADR-0131, PUT /api/workspaces/{id}/sip/recording):
  // answered inbound calls / connected outbound calls are recorded into
  // /phone_recordings/YYYY_MM_DD/ of the Disk. Default off.
  bool record_inbound = 24;
  bool record_outbound = 25;
  // The server can record calls (LiveKit Egress is configured). The switches can be set either
  // way; without it nothing is recorded.
  bool recording_available = 26;
}

// How inbound calls reach the server (ADR-0121). UNSPECIFIED in PutSipInboundRequest = keep the
// saved mode (clients before ADR-0121).
enum SipInboundMode {
  SIP_INBOUND_MODE_UNSPECIFIED = 0;
  SIP_INBOUND_MODE_DIRECT = 1;   // the provider sends INVITE to our IP (ADR-0117)
  SIP_INBOUND_MODE_REGISTER = 2; // we register at the provider; calls come over the registration
}

// The state of the registration at the provider (ADR-0121 §3).
enum SipRegistrationStatus {
  SIP_REGISTRATION_STATUS_UNSPECIFIED = 0;
  SIP_REGISTRATION_STATUS_OFF = 1;         // not in REGISTER mode, or inbound calls off
  SIP_REGISTRATION_STATUS_UNAVAILABLE = 2; // the registration agent is not connected
  SIP_REGISTRATION_STATUS_REGISTERING = 3;
  SIP_REGISTRATION_STATUS_REGISTERED = 4;
  SIP_REGISTRATION_STATUS_FAILED = 5; // error says why ("auth", "403", "timeout", …)
}

// The registration at the provider (REGISTER mode, ADR-0121). The password is never sent back.
message SipRegistration {
  // Registrar / outbound proxy «host[:port]»; empty = the account's host and port.
  string registrar = 1;
  // SIP domain of the address of record; empty = the account's host.
  string domain = 2;
  uint32 expires_sec = 3;   // the requested registration interval, 60..3600 (600)
  uint32 keepalive_sec = 4; // OPTIONS / CRLF keepalive, 0 = off or 15..120 (30)
  // Credentials of the registration when they differ from the account's; empty = the account's
  // auth username (or username) and password.
  string auth_username = 5;
  bool has_password = 6;
  SipRegistrationStatus status = 7;
  string error = 8; // a code or a reason without secrets; empty = none
  google.protobuf.Timestamp registered_at = 9;
  google.protobuf.Timestamp expires_at = 10;
  // The registered contact with the user part masked: «sip:c…@203.0.113.7:5080».
  string contact_masked = 11;
}

// The registration fields of PutSipInboundRequest (REGISTER mode).
message SipRegistrationInput {
  string registrar = 1;
  string domain = 2;
  uint32 expires_sec = 3;   // 0 = 600
  uint32 keepalive_sec = 4; // 0 = off
  string auth_username = 5;
  // Unset = keep the stored one; "" = drop it (the account's password is used).
  optional string password = 6;
}

// GET /api/workspaces/{id}/sip (MANAGE_INTEGRATIONS, people) → 200 GetSipSettingsResponse; a
// workspace that never saved settings gets the defaults (enabled false, transport UDP).
message GetSipSettingsResponse {
  SipSettings settings = 1;
}

// PUT /api/workspaces/{id}/sip (MANAGE_INTEGRATIONS, people) → 200 PutSipSettingsResponse with the
// saved settings; WORKSPACE_UPDATE carries the new Workspace.sip_enabled. The whole object is
// replaced, except the password: unset keeps the stored one, "" removes it, a value replaces it.
// enabled = true needs host and caller_id. With enabled = true the LiveKit trunk is created or
// replaced; with false it is deleted (calls stop being possible). Errors: 422 VALIDATION (field
// = the lowerCamelCase name; host must be a public address), 502 SIP_PROVIDER_ERROR when
// LiveKit refuses the trunk (nothing is saved but last_error; the message is LiveKit's text),
// 503 when LiveKit is unreachable.
message PutSipSettingsRequest {
  bool enabled = 1;
  string provider = 2;
  string host = 3;
  SipTransport transport = 4;
  string username = 5;
  optional string password = 6; // ≤ 256 bytes
  string caller_id = 7;          // normalised like a callee number (8 495… → +7495…)
  string outbound_prefix = 8;    // an optional «+» followed by up to 8 digits; may be empty
  repeated string allowed_prefixes = 9; // ≤ 50, each «+» and 1..15 digits
  // Same characters as username; empty = authenticate as username.
  string auth_username = 10;
  // 0 = 5060, else 1..65535. A «host:port» in host is still accepted: its port is used when
  // this is 0, and must equal this otherwise (422 field port).
  uint32 port = 11;
}

message PutSipSettingsResponse {
  SipSettings settings = 1;
}

// PUT /api/workspaces/{id}/sip/recording (MANAGE_INTEGRATIONS, people) → 200
// PutSipRecordingResponse: the call recording switches (ADR-0131). The recording of a call is
// started when it is answered by a person or a bot (inbound: not while the menu plays) or
// connected (outbound), and ends with the call; the file (Ogg/Opus) goes to the Disk as
// /phone_recordings/YYYY_MM_DD/YYYYMMDDHHMM_<number digits>_<IN|OUT>.ogg owned by the workspace
// owner, counted in the workspace storage. A missing /phone_recordings is created with access
// for the owner only («Только выбранные»); the owner shares it. 409 PLAN_LIMIT below Business.
message PutSipRecordingRequest {
  bool record_inbound = 1;
  bool record_outbound = 2;
}

message PutSipRecordingResponse {
  SipSettings settings = 1;
}

// POST /api/workspaces/{id}/sip/test (MANAGE_INTEGRATIONS, people; 5 per hour per workspace,
// else 429 SIP_RATE_LIMITED) → 200 TestSipResponse. LiveKit has no registration / OPTIONS
// probe, so the server calls the workspace's own caller_id for at most 5 s from a service
// LiveKit room (a real, billable call; it appears in the journal with an empty room_id) and
// hangs up. ok = the provider took the call: answered, or refused with a SIP answer that proves
// authentication and routing work (408, 480, 486, 487, 600, 603, 607, 608). No answer at all
// within ~25 s (an unreachable host, a wrong transport) is ok = false. Failure is also
// stored as SipSettings.last_error; success clears it. 409 SIP_DISABLED when telephony is off.
// The request may take up to ~25 s.
message TestSipResponse {
  bool ok = 1;
  // Human-readable outcome with the SIP status when there is one, e.g. «answered»,
  // «486 Busy Here», «401 Unauthorized».
  string message = 2;
  uint32 sip_status = 3; // SIP response code, 0 = none (answered, or no SIP answer at all)
}

// A phone call (journal row and live state).
message SipCall {
  string id = 1;
  string workspace_id = 2;
  string room_id = 3; // empty: a connection test, or the room was deleted
  string number = 4;  // E.164 (+79161234567)
  SipCallDirection direction = 5;
  string started_by = 6; // user id of the caller (a person or a bot); empty = account gone
  SipCallStatus status = 7;
  // ENDED: "hangup" (DELETE by the caller), "hangup_moderator" (DELETE by someone with
  // MUTE_MEMBERS), "remote" (the line left the room: the callee hung up, or the call hit the
  // 2 h cap), "empty" (everybody left the room's call), "room_closed" (the LiveKit room ended),
  // "cancelled" (DELETE before the answer), "lost" (the line vanished without an event).
  // FAILED: "busy", "no_answer", "declined", "invalid_number", "provider_auth" (the provider
  // refused our credentials), "unavailable" (LiveKit SIP is not running or unreachable),
  // "error" (anything else; the journal row keeps the SIP code in the text: "error 503").
  // Empty while not final.
  string reason = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp answered_at = 10; // unset until ACTIVE
  google.protobuf.Timestamp ended_at = 11;    // unset until ENDED / FAILED
  // The LiveKit participant identity of the line: "sip:<id>". Clients match it against the
  // room's LiveKit participants to draw the phone tile.
  string participant_identity = 12;
  string ended_by = 13; // who hung up with DELETE; empty otherwise
  // Inbound calls (direction IN, ADR-0117). number is the caller's number; status is RINGING
  // from the moment the line got in (menu and ringing alike) until somebody answers (ACTIVE).
  // More reasons: "hangup_menu" (a route to «hang up»), "no_input", "no_answer", "no_members",
  // "loop", "declined" (everybody who rang declined), FAILED "busy_limit", "agent_unavailable",
  // "plan", "disabled".
  string answered_by = 14;               // the user who took the call
  string route = 15;                     // the path for the journal: «menu:<id>/2 → group:<id>»
  // Who rings right now. ACTIVE with ringing_user_ids: a transfer rings them (ADR-0132) while
  // answered_by — who hands the call over — is still on it.
  repeated string ringing_user_ids = 16;
  string via = 17;                       // the name of the menu or group the call came through
  // The provider's Call-ID of an inbound call that came over the registration (ADR-0121); empty
  // for DIRECT inbound and outbound calls.
  string provider_call_id = 18;
}

// POST /api/rooms/{id}/calls (PLACE_CALLS + VIEW_ROOM + CONNECT in the room, not a guest; a
// voice room of a workspace, not archived; the caller has a device in this room's call) →
// 201 SipCallResponse with status DIALING; SIP_CALL_UPDATE goes to everyone who sees the room
// on every status change. Errors: 404 no room / DM; 403 no PLACE_CALLS, a guest; 422
// VALIDATION (field "number": not a phone number) or «not a voice room»; 409 SIP_DISABLED;
// 409 CONFLICT «join the call first» (the caller is not in this room's call); 409
// SIP_CALL_ACTIVE; 422 SIP_NUMBER_NOT_ALLOWED; 429 SIP_RATE_LIMITED (20 calls per hour per
// workspace); 403 WORKSPACE_SUSPENDED. The line rings for up to 45 s; a call lasts 2 h at most.
message PlaceSipCallRequest {
  // The number to call: E.164 («+7 916 123-45-67»), or a Russian national number starting
  // with 8 or 7 (11 digits) — spaces, dashes, dots and brackets are ignored.
  string number = 1;
}

message SipCallResponse {
  SipCall call = 1;
}

// DELETE /api/rooms/{id}/calls/{cid} (the caller, or MUTE_MEMBERS in the room; bots too) →
// 200 SipCallResponse with the call ENDED (reason "hangup" / "hangup_moderator", or
// "cancelled" before the answer); the line is removed from the room. 404 unknown call or not
// in this room; 403 someone else's call without MUTE_MEMBERS; 409 CONFLICT the call already
// ended (the response body is then an ApiError).
//
// GET /api/workspaces/{id}/calls?from=<RFC 3339>&to=<RFC 3339>&cursor=<next_cursor>
// (VIEW_JOURNALS, people) → 200 ListSipCallsResponse: the workspace's calls, newest first,
// 100 per page, started_at in [from, to) when given. Connection tests are included; calls of
// rooms the caller cannot see (a closed room without an override) are left out, so a page may
// hold fewer than 100 (next_cursor still set while more rows follow).
message ListSipCallsResponse {
  repeated SipCall calls = 1;
  string next_cursor = 2; // empty = no more
}

// SIP_CALL_UPDATE: a phone call of a room was placed or changed status. To everyone who can
// view the room (guests too: they hear the line). Active calls are also in
// WorkspaceSnapshot.sip_calls (READY / WORKSPACE_CREATE). An inbound call (no room) goes to the
// user channels of the people it rings, rang or who answered it instead.
message SipCallUpdate {
  SipCall call = 1;
}

// ---------------------------------------------------------------- the exchange (ADR-0117)
//
// Internal numbers of people, bots and groups, call groups and voice menus (IVR) of the
// workspace. Step 1: the data and the settings; answering inbound calls on the provider number
// comes with step 2 behind the server switch SIP_INBOUND (SipSettings.inbound_available).
//
// Who: everything below needs MANAGE_INTEGRATIONS of the workspace and is never open to guests
// (404 for non-members, 403 for guests and members without the bit); bots by the same bit
// (ADR-0109). GET …/sip/extensions is open to every member but guests (the numbers are shown
// to the team: WorkspaceMember.extension). Changes need the telephony plan (409 PLAN_LIMIT).
// Deleting a member, a number, a group or a menu is never blocked by a route that points at
// it: the route stays with missing = true and behaves like «hang up».

// What a route does: the entry point (step 2), a key of a menu, «no key pressed», «nobody
// answered».
enum SipRouteKind {
  SIP_ROUTE_KIND_UNSPECIFIED = 0; // in requests: HANGUP
  SIP_ROUTE_KIND_HANGUP = 1;
  SIP_ROUTE_KIND_REPEAT = 2;    // play the menu again; only a key of a menu
  SIP_ROUTE_KIND_MENU = 3;      // another voice menu (id = SipIvrMenu.id)
  SIP_ROUTE_KIND_EXTENSION = 4; // a person or a bot (id = SipExtension.id of kind USER or BOT)
  SIP_ROUTE_KIND_GROUP = 5;     // a call group (id = SipGroup.id); a group's number is stored as GROUP
}

message SipRouteTarget {
  SipRouteKind kind = 1;
  string id = 2; // MENU / EXTENSION / GROUP; empty for HANGUP and REPEAT, and when the target was deleted
  // Output only: the target of MENU / EXTENSION / GROUP was deleted, or the number has nobody
  // (its member left). Such a route hangs up.
  bool missing = 3;
}

enum SipExtensionKind {
  SIP_EXTENSION_KIND_UNSPECIFIED = 0;
  SIP_EXTENSION_KIND_USER = 1;  // a person (user_id; empty when the member left the workspace)
  SIP_EXTENSION_KIND_BOT = 2;   // a bot member (user_id)
  SIP_EXTENSION_KIND_GROUP = 3; // the number of a group (group_id); made and deleted with the group
}

// An internal number: one numbering plan per workspace for people, bots and groups.
message SipExtension {
  string id = 1;
  string workspace_id = 2;
  string number = 3; // 2..6 digits, a leading zero allowed («101», «1001»)
  SipExtensionKind kind = 4;
  string user_id = 5;     // USER / BOT; empty = nobody (the member left)
  string group_id = 6;    // GROUP
  string description = 7; // ≤ 64 characters, for reference («Бухгалтерия»)
  google.protobuf.Timestamp created_at = 8;
  // USER / BOT (ADR-0129): external callers may not dial this number from a voice menu (it is
  // «not found» to them). Routes an admin set (keys, the entry point, fallbacks) and groups
  // still ring it; internal calls are not affected. Always false on a GROUP number.
  bool external_blocked = 9;
  // Output only: the name of the group of a GROUP number (the transfer picker of a member who may
  // not read the groups, ADR-0132).
  string group_name = 10;
}

enum SipGroupStrategy {
  SIP_GROUP_STRATEGY_UNSPECIFIED = 0; // in requests: RING_ALL
  // Every member rings at once (members who are not online ring too, with a push) until
  // somebody answers, the caller hangs up or the fallback's time runs out (ADR-0124); the
  // first who answers gets the call; members who become free meanwhile join the ringing.
  SIP_GROUP_STRATEGY_RING_ALL = 1;
  // One member after another in their order for member_ring_sec each, starting after the one
  // who answered last; members who are not online or busy are skipped; round after round
  // until somebody answers, the caller hangs up or the fallback's time runs out (ADR-0124).
  SIP_GROUP_STRATEGY_ROUND_ROBIN = 2;
}

message SipGroupMember {
  string extension_id = 1; // a number of kind USER or BOT
  uint32 position = 2;     // 0..n-1, the round-robin order
}

message SipGroup {
  string id = 1;
  string workspace_id = 2;
  string name = 3;            // 1..64 characters
  SipExtension extension = 4; // the group's own number (kind GROUP)
  SipGroupStrategy strategy = 5;
  uint32 ring_sec = 6;                 // unused since ADR-0124 (kept: 10..60, default 30)
  uint32 member_ring_sec = 7;          // ROUND_ROBIN: 5..60 per member, default 15
  SipRouteTarget on_fail = 8;          // the fallback's action; not REPEAT; kept while it is off
  repeated SipGroupMember members = 9; // by position, ≤ 20
  google.protobuf.Timestamp updated_at = 10;
  // The fallback (ADR-0124). Off (default): the group rings until somebody answers or the
  // caller hangs up; on_fail is not used. On: after fallback_sec seconds of ringing, when
  // everybody who rang declined, or at once when nobody can ring, the call follows on_fail
  // (another group, a person or a bot, a menu, hang up). At most 3 group fallbacks per call:
  // the next one hangs up (reason loop).
  bool fallback_enabled = 11;
  uint32 fallback_sec = 12; // 5..600, default 30
}

enum SipPromptStatus {
  SIP_PROMPT_STATUS_UNSPECIFIED = 0;
  SIP_PROMPT_STATUS_NONE = 1;  // no prompt uploaded: the menu goes to on_no_input at once
  SIP_PROMPT_STATUS_READY = 2; // prompt_file_id plays
}

message SipIvrItem {
  string digit = 1; // one of 0-9 * #
  SipRouteTarget action = 2;
}

// A voice menu: the prompt plays, the caller presses a key, the key's action follows. No key
// within input_timeout_sec after the prompt (or a key without an item) plays it again; after
// `repeats` plays on_no_input follows.
message SipIvrMenu {
  string id = 1;
  string workspace_id = 2;
  string name = 3; // 1..64 characters
  // The prompt: Ogg/Opus 48 kHz mono 32 kbit/s made by the server from the upload (≤ 3 min);
  // GET /api/files/{id} for MANAGE_INTEGRATIONS (listen in the settings). Empty = none.
  string prompt_file_id = 4;
  SipPromptStatus prompt_status = 5;
  uint32 prompt_duration_ms = 6;
  uint32 input_timeout_sec = 7;   // 3..15, default 5
  uint32 repeats = 8;             // 1..5, default 3
  SipRouteTarget on_no_input = 9; // not REPEAT
  repeated SipIvrItem items = 10; // by digit, ≤ 12
  google.protobuf.Timestamp updated_at = 11;
  string updated_by = 12;
  // ADR-0129: the caller may also dial an internal number (a person, a bot, a group) while the
  // menu plays or waits; the digits are collected until a 3 s pause or «#». A number that is
  // not dialable (unknown, unassigned, external_blocked) counts as a key without an item: the
  // menu plays again. Default off: keys only.
  bool dial_extensions = 13;
  // The recording notice (ADR-0131): made like the prompt; it plays to the caller right before
  // a key or a dialed number of this menu rings a person, a bot or a group (not before another
  // menu, a hang-up or «no input»). Empty = nothing plays. Whether calls are recorded is
  // SipSettings.record_inbound alone.
  string notice_file_id = 14;
  uint32 notice_duration_ms = 15;
}

// GET /api/workspaces/{id}/sip/extensions (any member but guests) → 200: all numbers by number,
// group numbers included.
message ListSipExtensionsResponse {
  repeated SipExtension extensions = 1;
}

// POST /api/workspaces/{id}/sip/extensions → 201 SipExtensionResponse: a number for a member
// (a person or a bot, never a guest; ≤ 500 numbers per workspace). WORKSPACE_MEMBER_UPDATE
// carries the member's new extension. Errors: 422 VALIDATION (number: 2..6 digits; userId: not
// a member / a guest; description: ≤ 64 characters), 409 SIP_EXTENSION_TAKEN (field number: the
// number is taken; field userId: the member already has a number), 409 CONFLICT (limit).
message CreateSipExtensionRequest {
  string number = 1;
  string user_id = 2;
  string description = 3;
  bool external_blocked = 4;
}

// PATCH /api/workspaces/{id}/sip/extensions/{eid} → 200 SipExtensionResponse; unset fields stay.
// user_id «» unassigns the number (it stays, routes to it hang up). A group's number changes
// only its number and description (user_id → 422). Errors as POST; 404 unknown number.
// DELETE …/extensions/{eid} → 204; a group's number is deleted with its group (422).
message UpdateSipExtensionRequest {
  optional string number = 1;
  optional string user_id = 2;
  optional string description = 3;
  optional bool external_blocked = 4; // true on a group's number → 422 (field externalBlocked)
}

message SipExtensionResponse {
  SipExtension extension = 1;
}

// GET /api/workspaces/{id}/sip/groups → 200.
message ListSipGroupsResponse {
  repeated SipGroup groups = 1;
}

// The members of a group in their order: SipExtension ids of kind USER or BOT, no repeats, ≤ 20.
message SipGroupMembers {
  repeated string extension_ids = 1;
}

// POST /api/workspaces/{id}/sip/groups → 201 SipGroupResponse (≤ 50 groups): the group and its
// number. Errors: 422 VALIDATION (name, number, ringSec, memberRingSec, members, onFail — also a
// fallback to the group itself or its own number, fallbackSec), 409
// SIP_EXTENSION_TAKEN (number), 409 CONFLICT (limit).
message CreateSipGroupRequest {
  string name = 1;
  string number = 2;
  SipGroupStrategy strategy = 3;
  uint32 ring_sec = 4;        // 0 = 30
  uint32 member_ring_sec = 5; // 0 = 15
  SipRouteTarget on_fail = 6; // unset = HANGUP
  SipGroupMembers members = 7;
  bool fallback_enabled = 8; // ADR-0124; default off
  uint32 fallback_sec = 9;   // 0 = 30
}

// PATCH /api/workspaces/{id}/sip/groups/{gid} → 200 SipGroupResponse; unset fields stay, set
// members replace the whole list with its order (the round-robin pointer starts over). DELETE
// …/groups/{gid} → 204 with its number; routes to it remain missing.
message UpdateSipGroupRequest {
  optional string name = 1;
  optional string number = 2;
  optional SipGroupStrategy strategy = 3;
  optional uint32 ring_sec = 4;
  optional uint32 member_ring_sec = 5;
  SipRouteTarget on_fail = 6;  // set = replace
  SipGroupMembers members = 7; // set = replace
  optional bool fallback_enabled = 8;
  optional uint32 fallback_sec = 9;
}

message SipGroupResponse {
  SipGroup group = 1;
}

// GET /api/workspaces/{id}/sip/ivr → 200.
message ListSipIvrMenusResponse {
  repeated SipIvrMenu menus = 1;
}

// The keys of a menu: one item per digit, ≤ 12.
message SipIvrItems {
  repeated SipIvrItem items = 1;
}

// POST /api/workspaces/{id}/sip/ivr → 201 SipIvrMenuResponse (≤ 20 menus). Errors: 422
// VALIDATION (name, inputTimeoutSec, repeats, onNoInput, items / digit, promptSourceFileId),
// 409 CONFLICT (limit), 503 when the server has no ffmpeg.
message CreateSipIvrMenuRequest {
  string name = 1;
  uint32 input_timeout_sec = 2; // 0 = 5
  uint32 repeats = 3;           // 0 = 3
  SipRouteTarget on_no_input = 4;
  SipIvrItems items = 5;
  // An audio file the caller uploaded to this workspace (POST /api/workspaces/{id}/files):
  // MP3, Ogg or WAV by its content, ≤ 10 MB, ≤ 3 min. The server makes the prompt from it
  // (Ogg/Opus 48 kHz mono 32 kbit/s, loudness −16 LUFS) as a file of the workspace counted in
  // its quota, not encrypted; the upload itself goes with the orphan cleanup. The request then
  // takes up to ~60 s. Empty = no prompt.
  string prompt_source_file_id = 6;
  bool dial_extensions = 7;
  // The recording notice: an upload under the same rules as prompt_source_file_id. Empty = none.
  string notice_source_file_id = 8;
}

// PATCH /api/workspaces/{id}/sip/ivr/{mid} → 200 SipIvrMenuResponse; unset fields stay, set
// items replace all keys. prompt_source_file_id: a new upload replaces the prompt, «» removes
// it (the old prompt file is deleted). DELETE …/ivr/{mid} → 204 with its prompt; routes to it
// remain missing.
message UpdateSipIvrMenuRequest {
  optional string name = 1;
  optional uint32 input_timeout_sec = 2;
  optional uint32 repeats = 3;
  SipRouteTarget on_no_input = 4; // set = replace
  SipIvrItems items = 5;          // set = replace
  optional string prompt_source_file_id = 6;
  optional bool dial_extensions = 7;
  // A new upload replaces the recording notice, «» removes it (the old file is deleted).
  optional string notice_source_file_id = 8;
}

message SipIvrMenuResponse {
  SipIvrMenu menu = 1;
}

// ---------------------------------------------------------------- inbound calls (ADR-0117 step 2)
//
// The provider sends INVITE for caller_id to LiveKit SIP; LiveKit puts the line into a room of
// its own («sipin_<workspace id>_…») and the server walks the entry point: a voice menu plays
// through the IVR worker, a number or a group rings its people. Only when the workspace switched
// inbound calls on, the server can take them (SipSettings.inbound_available), the telephony plan
// and telephony switched on. In REGISTER mode (ADR-0121) the registration agent calab-sipreg
// registers at the provider and hands the calls to LiveKit SIP over loopback.

// PUT /api/workspaces/{id}/sip/inbound (MANAGE_INTEGRATIONS, people) → 200 PutSipInboundResponse.
// enabled = true needs telephony on (SipSettings.enabled), a target other than HANGUP / REPEAT and
// a server that can take inbound calls; the server creates or replaces the LiveKit inbound trunk
// (numbers = caller_id; DIRECT: allowed addresses = the provider host's A/AAAA records now, the
// server's SIP_INBOUND_ALLOWED_ADDRESSES and allowed_cidrs; REGISTER: 127.0.0.1 and an internal
// digest password) and a dispatch rule that makes a room per call. enabled = false deletes both;
// live inbound calls end ("disabled"). Errors: 422 VALIDATION (target, allowedCidrs, registrar,
// domain, expiresSec, keepaliveSec, regAuthUsername, regPassword), 409 SIP_DISABLED (telephony
// off, no IVR worker token; REGISTER: no registration agent token on the server), 409
// SIP_REGISTRATION_TAKEN (another workspace registers the same account), 429 SIP_RATE_LIMITED
// (more than 10 mode / credential changes per hour), 502 SIP_PROVIDER_ERROR (LiveKit refused;
// last_error), 409 PLAN_LIMIT.
message PutSipInboundRequest {
  bool enabled = 1;
  SipRouteTarget target = 2;
  // IPv4 / IPv6 addresses or CIDR ranges of the provider («203.0.113.0/24»), ≤ 20; for providers
  // that send calls from a pool rather than from their host's address. REGISTER mode: the
  // sources the agent takes INVITEs from beyond the registrar's and the host's addresses.
  repeated string allowed_cidrs = 3;
  SipInboundMode mode = 4; // UNSPECIFIED = keep the saved mode
  SipRegistrationInput registration = 5; // REGISTER mode; unset = keep the saved fields
}

message PutSipInboundResponse {
  SipSettings settings = 1;
}

// SIP_INBOUND_RING: an inbound call rings the recipient (a person or a bot): to every device of
// the user (and to a bot's webhook). Answer with POST /api/sip/inbound/{cid}/accept, refuse with
// …/decline. SIP_CALL_UPDATE follows on the user channel on every change (another member
// answered, the caller hung up, the ringing moved on); the modal closes when the recipient is no
// longer in ringing_user_ids. Ringing calls are also in WorkspaceSnapshot.sip_calls (READY).
message SipInboundRing {
  SipCall call = 1;
}

// POST /api/sip/inbound/{cid}/accept (a user the call rings now; bots too) → 200
// SipInboundAcceptResponse: the call is ACTIVE with answered_by = the caller, and join holds a
// LiveKit token for the call's room (microphone and listening only). Errors: 404 unknown call /
// not ringing the caller, 409 CONFLICT (somebody else answered first, or the call ended).
// POST /api/sip/inbound/{cid}/join (the user who answered) → 200 JoinVoiceResponse: a fresh token
// (reconnects). POST /api/sip/inbound/{cid}/decline (a user it rings) → 204: this user stops
// ringing; when nobody is left the route goes on as if nobody answered. DELETE
// /api/sip/inbound/{cid} (the user who answered, or MANAGE_INTEGRATIONS of the workspace) → 200
// SipCallResponse ENDED "hangup".
message SipInboundAcceptResponse {
  SipCall call = 1;
  JoinVoiceResponse join = 2;
}

// POST /api/workspaces/{id}/sip/calls/{cid}/transfer (ADR-0132; the member connected to the
// answered inbound call — answered_by — or MANAGE_INTEGRATIONS of the workspace; bots too) → 200
// SipCallResponse: the call stays ACTIVE with the member (answered_by) and ringing_user_ids
// ring the target (SIP_INBOUND_RING to them: the same ringing as a call to a number or a
// group). The target answers (POST …/inbound/{cid}/accept) → the call is theirs; the
// transferring member stays with the caller until the target is in the room, then hears
// SIP_CALL_UPDATE (answered_by the target) and is taken out of it (the target does not connect
// in 15 s: the call is the member's again, route «transfer:not_connected»); nobody answers in
// 30 s (a group with a fallback: its
// fallback_sec; the fallback itself is not followed), everybody declines or DELETE …/transfer
// (the same callers) → 200 SipCallResponse: the transfer is over and the call stays with the
// member. The caller is never dropped by a transfer. external_blocked does not apply (an
// employee's transfer is internal). Exactly one target: user_id (a member, a person or a bot,
// with or without a number), extension_id (a person's, a bot's or a group's number) or number
// (as typed). Errors: 404 unknown call / not in this workspace, 403 neither on the call nor
// MANAGE_INTEGRATIONS, 409 CONFLICT (not answered yet, over, a transfer already rings, routed
// too many times; DELETE: no transfer rings), 409 BUSY (the target is in another call, its
// group has nobody free), 422 VALIDATION target (none or several, unknown, a guest, a number
// with nobody behind it, the member on the call themselves).
message TransferSipCallRequest {
  string user_id = 1;
  string extension_id = 2;
  string number = 3;
}

// ---------------------------------------------------------------- active calls (ADR-0128)
//
// GET /api/workspaces/{id}/sip/calls (MANAGE_INTEGRATIONS, not a guest; bots too) → 200
// ListSipActiveCallsResponse: the calls of the workspace going on right now, oldest first —
// inbound ones from their live state (a menu plays, people's devices ring, answered), outbound
// ones of rooms the caller can see. call.number is the full number for a caller with
// VIEW_JOURNALS (as the journal shows it) and masked otherwise («+7 916 ***-**-67»,
// number_masked). SIP_CALLS_CHANGED tells the workspace's MANAGE_INTEGRATIONS members to read
// it again.
message ListSipActiveCallsResponse {
  repeated SipActiveCall calls = 1;
}

// Where a live call is now.
enum SipActiveStep {
  SIP_ACTIVE_STEP_UNSPECIFIED = 0;
  // An outbound call before the answer (DIALING / RINGING at the far end).
  SIP_ACTIVE_STEP_DIALING = 1;
  // An inbound call in a voice menu: step_id / step_name are the menu's.
  SIP_ACTIVE_STEP_MENU = 2;
  // An inbound call rings people (call.ringing_user_ids): step_id / step_name are the group's
  // when it rings a group, empty when it rings one number.
  SIP_ACTIVE_STEP_RINGING = 3;
  // Answered: an inbound call by call.answered_by, an outbound one in the room call.room_id.
  SIP_ACTIVE_STEP_CONNECTED = 4;
}

message SipActiveCall {
  SipCall call = 1;
  SipActiveStep step = 2;
  string step_id = 3;
  string step_name = 4;
  bool number_masked = 5;
}

// SIP_CALLS_CHANGED: a call of the workspace started, moved on (a menu, a group, an answer) or
// ended. No details: to the sessions of the workspace's members with MANAGE_INTEGRATIONS (not
// guests, not bots), who read GET …/sip/calls again while they look at it.
message SipCallsChanged {
  string workspace_id = 1;
}
