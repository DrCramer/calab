plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.calab.host'
version = '1.0.0'

android {
  namespace 'io.calab.host'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Plain Firebase Cloud Messaging (no react-native-firebase): the token is the FCM endpoint of
  // ADR-0070 (Android). Without google-services.json the default FirebaseApp is absent and the
  // module reports push as unsupported; the app still builds and runs.
  implementation platform('com.google.firebase:firebase-bom:35.1.0')
  implementation 'com.google.firebase:firebase-messaging'
  implementation 'androidx.core:core:1.16.0'
}
