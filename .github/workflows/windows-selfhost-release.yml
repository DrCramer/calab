name: self-hosted Windows release

on:
  push:
    tags: ['win-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to build (for example 3.7.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: selfhost-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  UPDATE_REPO: DrCramer/calab
  UPDATE_URL: https://github.com/DrCramer/calab/releases/latest/download/
  APP_ORIGIN: https://calab.cramerstation.ru

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          if [[ -z "$v" && "$GITHUB_REF" == refs/tags/win-v* ]]; then v="${GITHUB_REF_NAME#win-v}"; fi
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::expected a stable SemVer version X.Y.Z; got '${v//[^0-9A-Za-z.+_-]/?}'"
            exit 1
          fi
          (cd apps/desktop && npm version "$v" --no-git-tag-version --allow-same-version)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify patched native module sources
        run: |
          grep -q VC_CAPS_LOCK_STATE node_modules/uiohook-napi/libuiohook/include/uiohook.h
          grep -q CALABA_UIOHOOK_PATCH_V2 node_modules/uiohook-napi/src/lib/addon.c
          grep -q CALABA_HID_CAPS_V1 node_modules/uiohook-napi/libuiohook/src/darwin/input_hook.c

      - name: Build desktop app with self-host defaults
        env:
          MAIN_VITE_UPDATE_FEED: ${{ env.UPDATE_URL }}
          MAIN_VITE_UPDATE_GITHUB: ${{ env.UPDATE_REPO }}
          MAIN_VITE_DEFAULT_SERVER_URL: ${{ env.APP_ORIGIN }}
          MAIN_VITE_UPDATES_SIGNED: ''
        run: pnpm -F @calaba/desktop run build:app

      - name: Package Windows installer
        working-directory: apps/desktop
        env:
          UPDATE_URL: ${{ env.UPDATE_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          rm -rf ../../node_modules/uiohook-napi/bin
          pnpm exec electron-builder --win nsis --x64 --publish never \
            -c.publish.provider=generic "-c.publish.url=$UPDATE_URL" \
            '-c.nsis.artifactName=Calab-Setup-${version}-${arch}.${ext}' \
            -c.directories.output=dist-release

      - name: Verify installer and update metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          installer="apps/desktop/dist-release/Calab-Setup-$VERSION-x64.exe"
          manifest=apps/desktop/dist-release/latest.yml
          test -s "$installer"
          test -s "$installer.blockmap"
          test -s "$manifest"
          grep -Fxq "version: $VERSION" "$manifest"
          grep -Fxq "path: Calab-Setup-$VERSION-x64.exe" "$manifest"
          grep -Eq '^[[:space:]]+sha512: [A-Za-z0-9+/]+=*$' "$manifest"
          if grep -Eq '^[[:space:]]*(- url|path): *\S*/' "$manifest"; then
            echo '::error::GitHub release manifest must contain asset file names, not URLs'
            exit 1
          fi
          node apps/desktop/scripts/check-native.mjs apps/desktop/dist-release
          ls -lh apps/desktop/dist-release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selfhost-windows-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            apps/desktop/dist-release/*.exe
            apps/desktop/dist-release/*.blockmap
            apps/desktop/dist-release/latest.yml

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            infra/ci
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selfhost-windows-${{ needs.build.outputs.version }}
          path: dist-release
      - name: Create draft release for smoke check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $tag already exists; published releases are immutable"
            exit 1
          fi
          if grep -EHn '^\s*(- url|path): *\S*/' dist-release/latest.yml; then
            echo '::error::latest.yml must refer to assets by file name'
            exit 1
          fi
          bash infra/ci/changelog-section.sh "$VERSION" CHANGELOG.md > release-notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "Calab $VERSION" \
            --notes-file release-notes.md dist-release/*
