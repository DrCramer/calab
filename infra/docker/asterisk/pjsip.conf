; A fake SIP provider for the manual end-to-end check of the registration mode (ADR-0121 §7),
; compose.dev.yml profile sip-dev. The registration agent registers the account 130098 here
; (like Plusofon: login = auth login), Asterisk keeps one contact and calls it on demand.
; Dev only: the password is not a secret.

[global]
type=global
user_agent=calab-dev-provider

[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5070

[130098]
type=endpoint
context=from-agent
disallow=all
allow=ulaw,alaw
auth=130098-auth
aors=130098
direct_media=no
rtp_symmetric=yes
dtmf_mode=rfc4733

[130098-auth]
type=auth
auth_type=userpass
username=130098
password=dev-only-130098

[130098]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
