; Dialplan of the fake provider (compose.dev.yml profile sip-dev, ADR-0121 §7).
;
; Call the workspace over its registration (from +79161234567; one second after the answer the
; key «1» goes as RFC 4733 — the voice menu takes it):
;   docker compose -f infra/docker/compose.dev.yml exec asterisk \
;     asterisk -rx "channel originate Local/call@dev extension wait@dev"
; Hang up from this side: asterisk -rx "channel request hangup all".

[general]
static=yes
writeprotect=yes

[from-agent]
; The workspace does not call out through this fake (outbound calls go over the LiveKit trunk).
exten => _X.,1,Hangup(21)

[dev]
exten => call,1,Set(CALLERID(all)="Dev caller" <+79161234567>)
 same => n,Dial(PJSIP/130098,30,D(w1))
 same => n,Hangup()

exten => wait,1,Answer()
 same => n,Wait(120)
 same => n,Hangup()
